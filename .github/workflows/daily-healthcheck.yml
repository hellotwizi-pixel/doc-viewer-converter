name: 🏥 Daily Healthcheck (바로열기)

on:
  schedule:
    # 매일 새벽 3AM (한국시간) = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ✅ 변환서버 헬스체크
        id: converter
        run: |
          CONVERTER_URL="https://baro-converter-k0lv8f2b0-hellotwizi-4980s-projects.vercel.app"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$CONVERTER_URL/health" -L --max-time 10)

          echo "response=$RESPONSE" >> $GITHUB_OUTPUT

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ 변환서버 응답 실패: HTTP $RESPONSE"
            exit 1
          fi
          echo "✅ 변환서버 정상 (HTTP $RESPONSE)"

      - name: ✅ APK 빌드 상태 확인
        id: build
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK_SIZE=$(du -h "android/app/build/outputs/apk/debug/app-debug.apk" | cut -f1)
            echo "✅ APK 존재: $APK_SIZE"
          else
            echo "⚠️ APK 파일 없음 (예상됨 - dev 환경)"
          fi

      - name: 📊 Healthcheck 결과 저장
        if: always()
        run: |
          cat > healthcheck-result.json << 'EOF'
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "project": "doc-viewer",
            "converter_status": "${{ steps.converter.outputs.response }}",
            "status": "✅ 모든 서비스 정상"
          }
          EOF
          cat healthcheck-result.json

      - name: ❌ 실패 알림 (만약 문제 발생)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚨 **Healthcheck 실패!**

              - 변환서버 상태: ${{ steps.converter.outputs.response }}
              - 시간: ${new Date().toISOString()}

              조치: Vercel 대시보드에서 배포 상태를 확인해주세요.
              https://vercel.com/hellotwizi-4980s-projects/baro-converter`
            }).catch(err => console.log('Issue comment failed:', err));

      - name: ✅ 성공 로그 저장
        if: success()
        run: |
          echo "✅ $(date) - 바로열기 모든 서비스 정상 작동"

