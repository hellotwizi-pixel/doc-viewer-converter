name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: DavidWells/railway-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get deployed URL
        run: |
          echo "Railway deployment started. Check your Railway dashboard."
