<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2933" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>바로열기 — 문서 뷰어</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">바로열기</span>
      <span id="doc-title" class="doc-title"></span>
      <button id="settings-btn" class="close-btn" title="PPT·한글 고화질 변환 서버 설정">⚙︎</button>
      <button id="close-btn" class="close-btn" hidden>닫기</button>
    </header>

    <!-- 변환 서버 설정 패널 -->
    <div id="settings-panel" class="settings-panel" hidden>
      <div class="settings-card">
        <div class="settings-title">PPT·한글 고화질 변환 서버</div>
        <p class="settings-desc">주소를 넣으면 PPT·한글이 원본 화질로 열립니다. 비우면 서버 없이 근사 렌더로 봅니다.</p>
        <input id="settings-url" class="settings-input" type="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://....run.app" />
        <div class="settings-actions">
          <button id="settings-cancel" class="sbtn">취소</button>
          <button id="settings-save" class="sbtn sprimary">저장</button>
        </div>
        <div id="settings-status" class="settings-status"></div>
      </div>
    </div>

    <main id="app">
      <!-- (a) 파일 선택 -->
      <section id="view-fileselect" class="view">
        <div id="dropzone" class="dropzone">
          <p class="dz-title">문서를 열어보세요</p>
          <p class="dz-sub">PDF · Word(DOCX) 지원 · 편집 없이 보기만</p>
          <label class="pick-btn">
            파일 선택
            <input id="file-input" type="file" accept=".pdf,.docx,.pptx,.xlsx,.csv,.hwp,.hwpx,.xls,.ppt,.doc,application/pdf,text/csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/x-hwp" hidden />
          </label>
          <p class="dz-hint">여기로 파일을 끌어다 놓아도 됩니다</p>
          <p id="conv-status" class="conv-status"></p>
        </div>
      </section>

      <!-- (b) 렌더 뷰포트 -->
      <section id="view-viewport" class="view" hidden>
        <div id="pdf-toolbar" class="pdf-toolbar" hidden>
          <button id="zoom-out" class="zbtn" aria-label="축소">−</button>
          <span id="zoom-label" class="zlabel">100%</span>
          <button id="zoom-in" class="zbtn" aria-label="확대">+</button>
          <button id="zoom-fit" class="zbtn zfit">맞춤</button>
        </div>
        <div id="pdf-container" class="pdf-container" hidden></div>
        <article id="docx-container" class="docx-container" hidden></article>
      </section>

      <!-- (c) 에러/폴백 -->
      <section id="view-error" class="view" hidden>
        <div class="error-box">
          <p id="error-msg" class="error-msg"></p>
          <div id="hwp-fallback" class="hwp-fallback" hidden>
            <a class="hancom-link" href="https://www.hancom.com/product/productHwpViewerMain.do" target="_blank" rel="noopener noreferrer">한컴 오피스 뷰어 안내</a>
          </div>
          <button id="offline-btn" class="pick-btn" hidden>그래도 근사 렌더로 보기</button>
          <button id="retry-btn" class="pick-btn">다른 파일 열기</button>
        </div>
      </section>
    </main>

    <div id="busy" class="busy" hidden><div class="busy-box"><span class="spinner"></span><span id="busy-text">문서 여는 중…</span></div></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
